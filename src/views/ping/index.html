<style>

        }

            box-shadow: 0 0 25px currentColor;
        }

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 110, 28, 0.7); }

<body class="bg-background text-on-surface font-body-md text-body-md min-h-screen pb-24 overflow-x-hidden">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">TeamVibe</h1>
</div>
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined text-primary hover:scale-105 transition-transform duration-200" data-icon="notifications">notifications</button>

<main class="px-margin-mobile pt-md space-y-lg">
<!-- Welcome Section -->

<h2 class="font-headline-md text-headline-md text-on-surface">Cần gì, Ping nấy! ⚡</h2>
</section>
<!-- Ping Grid -->
<section class="grid grid-cols-2 gap-4">
<!-- Ping Item: Open Door -->
<button class="ping-glow flex flex-col items-center justify-center aspect-square p-4 rounded-lg bg-surface-container-lowest shadow-sm border border-outline-variant/30 text-primary transition-all duration-150 active:scale-90 hover:scale-[1.03] text-primary" onclick="triggerPing('🚪 Mở cửa')">
<span class="text-5xl mb-2">🚪</span>
<span class="font-headline-md text-headline-md">Mở cửa</span>
</button>
<!-- Ping Item: Restroom -->
<button class="ping-glow flex flex-col items-center justify-center aspect-square p-4 rounded-lg bg-surface-container-lowest shadow-sm border border-outline-variant/30 text-secondary transition-all duration-150 active:scale-90 hover:scale-[1.03]" onclick="triggerPing('🚽 Đi vệ sinh')">
<span class="text-5xl mb-2">🚽</span>
<span class="font-headline-md text-headline-md">Đi vệ sinh</span>
</button>
<!-- Ping Item: Cafe -->
<button class="ping-glow flex flex-col items-center justify-center aspect-square p-4 rounded-lg bg-secondary-container shadow-sm text-on-secondary-container transition-all duration-150 active:scale-90 hover:scale-[1.03]" onclick="triggerPing('☕ Cafe?')">
<span class="text-5xl mb-2">☕</span>
<span class="font-headline-md text-headline-md">Cafe?</span>
</button>
<!-- Ping Item: Shipper -->
<button class="ping-glow flex flex-col items-center justify-center aspect-square p-4 rounded-lg bg-surface-container-lowest shadow-sm border border-outline-variant/30 text-primary-container transition-all duration-150 active:scale-90 hover:scale-[1.03]" onclick="triggerPing('📦 Shipper tới')">
<span class="text-5xl mb-2">📦</span>
<span class="font-headline-md text-headline-md">Shipper</span>
</button>
<!-- Ping Item: Meeting -->
<button class="ping-glow flex flex-col items-center justify-center aspect-square p-4 rounded-lg bg-error-container shadow-sm text-on-error-container transition-all duration-150 active:scale-90 hover:scale-[1.03]" onclick="triggerPing('🔥 Họp gấp!')">
<span class="text-5xl mb-2">🔥</span>
<span class="font-headline-md text-headline-md">Họp gấp!</span>
</button>
<!-- Ping Item: Milk Tea -->
<button class="ping-glow flex flex-col items-center justify-center aspect-square p-4 rounded-lg bg-tertiary-fixed shadow-sm text-on-tertiary-fixed transition-all duration-150 active:scale-90 hover:scale-[1.03]" onclick="triggerPing('🥤 Trà sữa?')">
<span class="text-5xl mb-2">🥤</span>
<span class="font-headline-md text-headline-md">Trà sữa?</span>
</button>
<!-- Ping Item: Game -->
<button class="col-span-2 flex items-center justify-center gap-4 p-6 rounded-lg bg-inverse-surface shadow-lg text-surface-bright transition-all duration-150 active:scale-95 hover:scale-[1.01]" onclick="triggerPing('🎮 ARAM 1 trận?')">
<span class="text-4xl">🎮</span>
<span class="font-headline-md text-headline-md">Làm ván ARAM không?</span>

<!-- Realtime Activity Log -->

<div class="flex justify-between items-end">

</div>
<div class="space-y-sm" id="activity-log">
<!-- Activity Card 1 -->
<div class="flex gap-4 p-4 rounded-lg bg-surface-container-low border-l-4 border-primary">
<div class="w-10 h-10 shrink-0 rounded-full bg-secondary-fixed flex items-center justify-center overflow-hidden">
<img alt="Tuan" data-alt="Close-up portrait of a young male with short dark hair and trendy glasses, styled in a vibrant illustrative way. The lighting is bright and cheerful, set against a warm yellow background that matches the energetic UI of the TeamVibe application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCiA3-eEu2fVkIUU960mpTrhsgy1Of2ZJtA4QYNbNiNj6z4XYe5dFR8O_E7Cy96EMAE9HSwNCodL6udAjVaV1g_yIFeEVkseh6UsDwwYB_-maaBP78b9XuJDVmLSMNoIw2mSJ7YTi28Ii9YgPBafYmAl_9URio8r1bvpEwi0Bz4hx2R8NXgHHlMXqqRshhjnSrRlfROGZcwiFZWg1CedrImckWjEywlX0lleCPIuOfj3d4MF_0lUWhQ-QNyroW3V4iUSUjjt-y_AQU">
</div>
<div class="flex-1">
<p class="font-body-md text-body-md"><span class="font-bold">Tuấn</span> đang cần mở cửa 🚪</p>

</div>
<!-- Activity Card 2 -->

<img alt="Linh" data-alt="A portrait of a cheerful young woman with long wavy hair and a friendly expression, depicted in a modern digital illustration style. The background is a soft mint green, providing a fresh and youthful look that complements the high-energy social tool aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvyehDbOi5vsK0XdU5dkzTMsy3M1LbTuTe0kz4-ZGeu1FKEp0UZI9rwk95edk0fooN5gES7R00CmMj6F-h5eBy8tsUaL5pyPG_qCbmXkRu9WVIqV75bOB0QqPMy5FotiOFSnRAtgrMump9RDxSmotBpL0T8ZrhYHN_Jl7p0yweqRR3PGFGmZl3yN9cgB8QV7nyysNsJUq80cnEXDWpOCQdCeo3JlnjnA5Lee6tqiDYiwis38KQc_hnf7oYox4UNTJjP0WwCe5B83k">
</div>
<div class="flex-1">
<p class="font-body-md text-body-md"><span class="font-bold">Linh:</span> Cafe đê ☕</p>
<p class="text-xs text-primary font-bold">Vừa xong</p>

</div>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-2xl shadow-[0_-4px_20px_rgba(144,77,0,0.1)] rounded-t-lg">

<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
<span class="font-label-md text-label-md">Lunch</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="campaign" style="font-variation-settings: 'FILL' 1;">campaign</span>

<span class="font-label-md text-label-md">Breakfast</span>
</a>

<script>
        function triggerPing(label) {
            const log = document.getElementById('activity-log');
            const newEntry = document.createElement('div');
            newEntry.className = "flex gap-4 p-4 rounded-lg bg-primary-fixed/20 border-l-4 border-primary-container animate-bounce";
            
            // Random user name for demo
            const users = ["Hùng", "Mai", "Kiên", "Trang"];
            const randomUser = users[Math.floor(Math.random() * users.length)];
            
            newEntry.innerHTML = `
                <div class="w-10 h-10 shrink-0 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${randomUser}" alt="${randomUser}" class="w-full h-full">
                </div>
                <div class="flex-1">
                    <p class="font-body-md text-body-md"><span class="font-bold">${randomUser}:</span> ${label}</p>
                    <p class="text-xs text-primary font-bold">Vừa xong</p>
                </div>
            `;
            
            log.prepend(newEntry);
            
            // Remove bounce after animation
            setTimeout(() => {
                newEntry.classList.remove('animate-bounce');
                newEntry.classList.add('transition-all', 'duration-500');
            }, 1000);

            // Simple vibration feedback if supported
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Simulating realtime updates
        setInterval(() => {
            const times = document.querySelectorAll('#activity-log .text-xs');
            times.forEach(t => {
                if (t.innerText === 'Vừa xong') {
                    // Stay "Vừa xong" for a bit then become minutes
                }
            });
        }, 60000);
    </script>
